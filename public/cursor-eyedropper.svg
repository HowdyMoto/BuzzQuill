<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!--
    Eyedropper mouse cursor (referenced from style.css with hotspot "2 22" — the
    pipette's TIP, which is the pixel being sampled). Intrinsic width/height are
    required: Firefox ignores an SVG cursor without them.

    Drawn twice: a white halo underneath, then the dark glyph, so it stays legible
    over both the dark pasteboard and light artwork.
  -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#fff" stroke-width="3.6" stroke-opacity="0.95">
      <path d="m2 22 1-1h3l9-9"/>
      <path d="M3 21v-3l9-9"/>
      <path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/>
    </g>
    <g stroke="#111" stroke-width="1.6">
      <path d="m2 22 1-1h3l9-9"/>
      <path d="M3 21v-3l9-9"/>
      <path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/>
    </g>
  </g>
</svg>
